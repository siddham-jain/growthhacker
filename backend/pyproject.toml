[project]
name = "growthhacker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "arq>=0.26",
  "redis>=5.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "tenacity>=9.0",
  "httpx>=0.28",
  "sse-starlette>=3.0",
  "google-auth-oauthlib>=1.2",
  "anthropic>=1.0",
  "openai>=1.55",
  "tavily-python>=0.8.5",
  "protego>=0.3",
  "tldextract>=5.1",
  "trafilatura>=2.0",
  "selectolax>=1.0",
  "playwright>=1.49",
  "pypdf>=5.1",
  "phonenumbers>=8.13",
  "py3langid>=0.3",
  "feedparser>=6.0",
  "regex>=2024.11",
  "tzdata>=2024.2",
  "numpy>=2.1",
  "fastembed>=0.4",
  "opencv-python-headless>=4.10",
  "rapidocr>=3.0",
  "onnxruntime>=1.20",
  "rapidfuzz>=3.14",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "respx>=0.21",
  "hypothesis>=6.100",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: hits real external APIs (opt-in)", "db: needs local postgres"]
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
